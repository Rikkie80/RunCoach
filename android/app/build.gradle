plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.example.runcoach"
    compileSdk flutter.compileSdkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.example.runcoach"
        minSdkVersion 21
        targetSdkVersion 35  // Android 15 = API 35 (Android 16 is API 36)
        versionCode flutter.versionCode
        versionName flutter.versionName
        multiDexEnabled true
        
        // Required for location permissions
        usesCleartextTraffic false
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
            
            // Disable proguard for location services
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        
        debug {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation platform(FlutterExtension.flutter.getPlatformDependencies)
    
    // Required for geolocator plugin on Android 16
    implementation 'androidx.lifecycle:lifecycle-process:2.8.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.0'
    implementation 'androidx.lifecycle:lifecycle-common:2.8.0'
    
    // For background location on Android 16
    implementation 'androidx.work:work-runtime:2.9.0'
}
